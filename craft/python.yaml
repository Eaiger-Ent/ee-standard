    bucket: 3
    sources:
    - testing 004
    unenforced: Bucket 3.
  python.no-flaky-tests:
    asserts: A test that does not pass consistently is fixed or deleted
    bucket: 2
    sources:
    - testing 005
    unenforced: Nothing asserts it. Repeated runs detect it; nothing prevents it.
  python.narrow-raises:
