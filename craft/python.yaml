    instrument:
      tool: ruff
      codes:
      - TD001
      - TD002
      - TD003
      - TD004
      - TD005
      - TD006
      - TD007
    level: strict
    alternatives:
    - tool: ruff
      codes:
      - FIX001
      - FIX002
      - FIX003
      - FIX004
      why: Demoted 2026-09-07 by review.strict.md C5. FIX002 asserts *no TODO at
        all*, which is a stronger claim than any source here proposes, and it made
        seven of this property's codes unreachable — no file containing a TODO could
        pass.
  python.no-unused-suppression:
    asserts: A `noqa` that suppresses nothing is removed
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      codes:
      - RUF100
    level: standard
  python.annotate-public-api:
