# The Craft register — Python.
#
# One file per scope, because a property's identity already carries its scope:
# `docs/craft/design.profiles.md` § `craft/`, one file per scope. Every key here
# begins `python.`, and a row that does not is a schema error rather than a
# matter of taste. `craft/meta.yaml` holds the contract, the levels, the sources
# these rows cite and the profiles' version history.
#
# **Migrated from `docs/craft/assess.rules.md` on 2026-09-08**, which becomes a
# stage record and stops being a source (ADR 0053). Nothing was dropped:
# `tests/test_craft_register.py` fails if a row in that document has no property
# here, which is a test rather than a promise holding the two together.
#
# What is *not* here, and deliberately:
#
# - **No file location.** ADR 0055: the surface comes from `controls.yaml`'s
#   `stacks:` block, so a `file:` key would be the second copy that ADR exists
#   to prevent. This register names the tool and the keys; the control register
#   names where they go. `scope:` is a different thing — it says which part of a
#   tree the property is *about*, not which file the setting is written to.
# - **No tool version.** The lockfile is the pin, per § What pins the tool
#   version.
# - **No `off` list.** A property with no `level` has no binding at any level,
#   and `unenforced:` says why. Listing negatives would be a second copy of the
#   register's own silence.
#
# `coextensive:` states how an instrument stands to its property. It is
# **required** on a `linter:` — an open set needs a reason to be trusted — and
# it is used on a closed set where the two are known not to line up, which is
# the honest place for a measured divergence.

properties:
  python.no-mutable-default-argument:
    asserts: A default argument is never a mutable literal
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      codes:
      - B006
      - RUF012
    level: standard
  python.no-call-in-default-argument:
