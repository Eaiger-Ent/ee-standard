    bucket: 1
    sources:
    - ruff
    - code-quality
    instrument:
      tool: ruff
      codes:
      - BLE001
      - E722
    level: standard
  python.exception-chaining:
    asserts: An exception raised inside `except` chains from the original
    bucket: 1
    sources:
    - ruff
    - code-quality
    instrument:
      tool: ruff
      codes:
      - B904
    level: standard
  python.no-silent-exception-swallow:
    asserts: A swallowed exception is swallowed **explicitly** — never by `pass`
      or `continue`
    bucket: 1
    sources:
    - ruff
    - code-quality
    instrument:
      tool: ruff
      codes:
      - S110
      - S112
      - SIM105
    level: standard
  python.no-log-and-reraise:
    asserts: An error is logged **or** re-raised, not both
    bucket: 2
    sources:
    - code-quality
    unenforced: Nothing in the register asserts it. TRY400 and TRY401 are adjacent
      and cover a different mistake.
  python.exception-carries-context:
    asserts: An error type or message adds information the caller did not have
    bucket: 3
    sources:
    - code-quality
    - clean-code 202
    unenforced: 'Bucket 3 by its own classification: whether a message carries context
      is a judgement.'
  python.exception-message-not-a-literal:
    asserts: An exception message is not a bare string literal at the raise site
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      codes:
      - EM101
      - EM102
    level: strict
  python.exception-type-carries-its-message:
    asserts: A long message belongs to an exception type, not to the raise site
    bucket: 1
    sources:
    - ruff
    - clean-code 202
    alternatives:
    - tool: ruff
      codes:
      - TRY003
      why: Demoted 2026-09-07 by review.strict.md C5, with the case. Re-enabling
        it re-enables a rule that claims enforcement it does not have.
    unenforced: C5 demoted the only candidate. TRY003 fires only where EM101 or
      EM102 already fires, and EM101's own remedy silences it while the message
      stays outside the exception class — a rule satisfied without the property
      being satisfied.
  python.function-length:
    asserts: A function has few statements and low branching
    bucket: 1
    sources:
    - clean-code 002
    - google
    - ruff
    instrument:
      tool: ruff
      codes:
      - PLR0915
      - C901
    settings:
      max-statements: 25
      max-complexity: 10
    level: standard
  python.function-parameter-count:
    asserts: A function takes few parameters, and very few positionally
    bucket: 1
    sources:
    - clean-code 101
    - ruff
    instrument:
      tool: ruff
      codes:
      - PLR0913
      - PLR0917
    level: standard
  python.nesting-depth:
    asserts: Control flow does not nest deeply
    bucket: 1
    sources:
    - clean-code 102
    instrument:
      tool: ruff
      codes:
      - PLR1702
      preview: true
    level: strict
  python.class-size:
    asserts: A class stays small and focused
    bucket: 1
    sources:
    - clean-code 105
    - solid 001
    instrument:
      tool: ruff
      codes:
      - PLR0904
      preview: true
    settings:
      max-public-methods: 20
    level: strict
  python.class-dependency-count:
    asserts: A class depends on few collaborators
    bucket: 2
    sources:
    - solid 101
    unenforced: Nothing asserts it. Countable from __init__ parameters, which is
      PLR0913 at a different site.
  python.shallow-inheritance:
    asserts: Inheritance hierarchies stay shallow
    bucket: 2
    sources:
    - solid 105
    unenforced: Nothing asserts it. Depth is mechanically countable and nothing
      counts it.
  python.return-count:
    asserts: A function has few exit points
    bucket: 1
    sources:
    - ruff
    alternatives:
    - tool: ruff
      codes:
      - PLR0911
      why: Never selected. Enabling it puts the register in contradiction with python.nesting-depth.
    unenforced: '**Incompatible, permanently.** An early return is the recommended
      fix for clean-code 102''s nesting and increments PLR0911''s count, so the
      two cannot both hold. The only such pair in this register.'
  python.no-redundant-assign-before-return:
    asserts: A value is returned rather than parked in a name first
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      codes:
      - RET504
    level: strict
  python.abstraction-ordering:
    asserts: Functions read high-level first, details after
    bucket: 3
    sources:
    - clean-code 203
    unenforced: 'Bucket 3: an ordering judgement.'
  python.single-responsibility:
    asserts: A unit has one reason to change
    bucket: 3
    sources:
    - solid 001
    - clean-code 105
    - pep20
    unenforced: 'Bucket 3: the principle, not a countable property.'
  python.depend-on-abstractions:
    asserts: Cross-module dependencies are on abstractions
    bucket: 3
    sources:
    - solid 002
    unenforced: Bucket 3.
  python.dependency-injection:
    asserts: Dependencies are provided, not constructed in place
    bucket: 3
    sources:
    - solid 102
    unenforced: Bucket 3.
  python.composition-over-inheritance:
    asserts: Behaviour is extended by composition unless the relation is genuinely
      *is-a*
    bucket: 3
    sources:
    - solid 104
    - solid 201
    - clean-code 201
    unenforced: Bucket 3.
  python.no-duplication:
    asserts: The same logic is not written twice
    bucket: 2
    sources:
    - clean-code 003
    - pep20
    unenforced: Nothing in ruff. A clone detector could hold it, at the cost of
      a second tool and a threshold no source agrees on.
  python.naming-form:
    asserts: Names follow the language's casing conventions
    bucket: 1
    sources:
    - pep8
    - google
    - ruff
    instrument:
      tool: ruff
      linter: pep8-naming
      coextensive: Every rule in it asserts a naming form and any rule it adds would
        too. The register cited N801-N818, which had already missed N999. Verified
        preview-free at ruff 0.16.5.
    level: standard
  python.naming-intent:
    asserts: A name says what the thing is for
    bucket: 3
    sources:
    - clean-code 001
    - clean-code 104
    - clean-code 205
    - pep20
    unenforced: Bucket 3. E741 catches three ambiguous single letters and nothing
      else, which is not the property.
  python.line-length:
    asserts: A line limit exists and the formatter agrees with it
    bucket: 1
    sources:
    - pep8
    - google
    - ruff
    instrument:
      tool: ruff
      codes:
      - E501
    settings:
      line-length: 88
    level: standard
  python.import-order:
    asserts: Imports are grouped and ordered
    bucket: 1
    sources:
    - pep8
    - google
    - ruff
    instrument:
      tool: ruff
      codes:
      - I001
    level: standard
  python.no-relative-parent-imports:
    asserts: A module does not import from its parent by relative path
    bucket: 1
    sources:
    - google
    instrument:
      tool: ruff
      codes:
      - TID252
    level: standard
  python.consistent-formatting:
    asserts: Formatting is not a per-author choice
    bucket: 1
    sources:
    - clean-code 005
    - pep8
    instrument:
      tool: ruff-format
      formatter: true
    level: standard
