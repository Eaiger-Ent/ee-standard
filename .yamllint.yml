# YML-001's single definition (ADR 0059), read by every locus: the editor hook
# passes it with `-c`, and the pre-commit hook and the CI step find it in the
# repository root. Hand-written, not deployed — `lint-yaml` has not run here,
# and its own config would not meet the floor (docs/19-phase-9-review.md).
#
# The floor and nothing else. Syntax errors are reported whatever this says;
# the two rules below are the rest of what `controls.yaml` requires, each at
# `level: error`, because yamllint exits 0 over warnings and a floor rule left
# at warning is a check that cannot fail. Style rules are a repository's
# choice to add, and none is added here: `extends: default` found 528 findings
# in this repository, nearly all indentation and braces.
#
# No `extends`, so no rule is on that this file does not name. A rule inherited
# from a preset takes the preset's level, and `default` sets `truthy` to
# warning.

# Not `ignore:`. `.gitignore` names what this repository does not author — the
# virtualenv, node_modules — and ADR 0019 forbids an exemption that hides a
# tracked file. `yamllint --list-files .` lists exactly what git tracks.
ignore-from-file: .gitignore

rules:
  # YAML 1.2.2 says keys are unique; PyYAML keeps the last and drops the rest
  # without a word. A second `verify:` silently replaced DOC-001's checks.
  key-duplicates:
    level: error
  # YAML 1.1 reads `NO` as false and `on` as true. `check-keys: false` keeps a
  # workflow's `on:` key legal.
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
    level: error
