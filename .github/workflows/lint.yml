# ee-control: DOC-001  ee-skill: lint-md@1.0.6  register: v0.5.0  register-contract: 5
#
# Deployed artefact — DOC-001's ci locus. Hand-edited since deployment: the
# checkout action is pinned to a commit SHA (SUP-003) and markdownlint-cli2 is
# invoked through npx so package-lock.json owns its version. Both are
# narrowings; re-running `lint-md` would revert them, which is the amend
# tracked in docs/04-build-plan.md § F.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-md:
    runs-on: ubuntu-latest
    steps:
      # SUP-003 — third-party actions are pinned to a commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Markdown
        # DOC-001 — the version comes from package-lock.json, the single
        # authority. No pin to keep in step with anything.
        run: |
          npm ci --no-audit --no-fund
          npx --no-install markdownlint-cli2 "**/*.md"
