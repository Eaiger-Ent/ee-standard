  python.no-hardcoded-credentials:
    asserts: No password, token or key is a literal in source
    bucket: 1
    sources:
    - security 001
    - asvs
    - ruff
    instrument:
      tool: ruff
      codes:
      - S105
      - S106
      - S107
    level: standard
