# ADR 0052's evidence gates. A group **names** a predicate rather than
# describing one: `controls.yaml` already carries a named set of *does this
# artefact exist* tests, read by `_applicable_gates`, and IAC-001's
# `applies_to: [terraform]` is the infrastructure group's gate already written
# and already read.
#
# Predicates resolve from `controls.yaml` first and from here second, and **a
# name defined in both is a schema error** — two definitions of *is there
# Terraform here* would eventually disagree about a repository and nobody would
# know which one the profile used. `tests/test_craft_register.py` is what makes
# that illegal rather than discouraged.
#
# Only one predicate belongs here, because no control gates on it and adding one
# to the control register purely for Craft's benefit is the direction ADR 0053
# sent Craft data away from.
predicates:
  openapi-document:
    asks: any file with a top-level `openapi` key exists
    why: >
      Keyed on the document's own declaration, not on its name. `openapi.yaml`,
      `api/spec.yaml` and `docs/openapi/v1.json` are all real conventions, and a
      glob over them would both miss and over-match — `spectral` finds nothing
      in a file that does not declare itself and plenty in one that does,
      whatever it is called. ADR 0052's requirement applied literally: the gate
      reads the same fact the rule needs in order to run at all.

# A profile is `<stack>/<level>` and nothing more (ADR 0052), and its version is
# a **counter rather than semver** — `design.profiles.md` § The version is a
# counter, because semver would point the wrong way. Direction is recorded per
# entry in `register-variance`'s own three words, and its rule comes with them:
# a mixed delta is a loosening.
#
# The entries live here rather than in the per-scope files because a profile
# spans them: `python/standard` binds every `python.` row at that level and
# every `any.` row whose evidence gate is open, so its version moves when either
# file does. Entries kept per-file would split one profile's history across two.
profiles:
  python/standard:
    version: 1
    changes:
      - version: 1
        moved: neither
        what: >
          First publication. The selection S3 benched, migrated from
          `docs/craft/assess.rules.md` without change.
  python/strict:
    version: 1
    changes:
      - version: 1
        moved: neither
        what: >
          First publication. `standard` plus the eleven properties
          `docs/craft/review.strict.md` measured.
  react/standard:
    version: 1
    changes:
      - version: 1
        moved: neither
        what: >
          First publication. The selection S3 benched, migrated from
          `docs/craft/assess.rules.md` without change.
  react/strict:
    version: 1
    changes:
      - version: 1
        moved: neither
        what: >
          First publication. `standard` plus `react.effect-dependencies-exhaustive`,
          which is the whole of the level on this stack — an asymmetry
          `design.profiles.md` § What `strict` adds records rather than explains
          away.
