# .markdownlint-cli2.yaml
# ee-control: DOC-001  ee-skill: lint-md@1.0.9  register: v0.29.0  register-contract: 35
#
# Deployed artefact — the runner's configuration. The rule set itself lives in
# .markdownlint.yaml. See docs/00-concepts.md § The provenance stamp.
#
# No longer hand-edited. `lint-md` reads `ignores` from
# .claude/skill-config.yaml (ADR 0042), so the empty list below is what the
# skill now writes rather than something corrected after it. Reconciled by the
# 1.0.9 run on 2026-08-28, which parsed the list, found it already equal to the
# configured one, and skipped the file.
# It is derived rather than kept, per ADR 0019: markdownlint-cli2 resolves its globs against the filesystem,
# not against git, so without this it lints the 164 third-party READMEs under
# node_modules as well as this repository's own files. `gitignore: true` scopes
# it to what git does not ignore; `ignores:` is empty because nothing here needs
# an exemption, and `markdown_gate_wired_at_all_loci` fails any entry added to it
# that matches a tracked file.
#
# It previously listed node_modules, .venv, .terraform and .pnpm-store by hand.
# Two of those named directories this repository neither contains nor gitignores,
# which is what a list nobody can check looks like — and `.claude/**` sat in the
# same list hiding eleven authored violations until somebody read it.
gitignore: true
ignores: []
