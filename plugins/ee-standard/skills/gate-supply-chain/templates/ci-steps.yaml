# Written into the target repository's gating workflow, as steps of the job that
# already runs on push or pull_request. A workflow that runs only on
# `workflow_dispatch` is not the ci locus — it runs when a human clicks it, and
# a control reachable only that way is declared and unreachable (theme T-3).
#
# Order matters and is not cosmetic. The frozen install comes first because
# every other gate's steps run the tools it places; a lint step written before
# it lints against nothing. When this gate runs after another has already
# written its steps, the install goes *above* them rather than at the end.
#
# {{FROZEN_INSTALL}} is the register's
# `ecosystems.{{ECOSYSTEM}}.frozen_install_command` for the lockfile this
# repository has, written verbatim. The register also holds the patterns the
# checker credits, and the schema requires each command to match one of them —
# so this gate cannot write an install step its own verify step will refuse.
      # ee-control: SUP-001  ee-skill: gate-supply-chain@{{SKILL_VERSION}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      - name: Install dependencies (frozen)
        run: {{FROZEN_INSTALL}}

      # ee-control: SUP-003  ee-skill: gate-supply-chain@{{SKILL_VERSION}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      #
      # The ci half of SUP-003's two loci. A full audit reaches every applicable
      # control including this one, so a repository whose gating workflow
      # already runs {{TOOL_INVOCATION}} with no `--control` needs no step here
      # — check before writing one, and say that you did not.
      - name: Supply chain
        run: {{TOOL_INVOCATION}} run --control SUP-003
