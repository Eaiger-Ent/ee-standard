# The local loci. Hooks run through `uv run`, so every tool executes at the
# version uv.lock pins — the same version the ci locus installs.
#
# Two moments live in this file from register contract 31 (ADR 0039), and
# `default_stages` is what keeps them apart. pre-commit's own default is *every
# stage*, so without this line a hook written for the pre-commit locus would
# also run before a push, and the register's `locus:` list would stop being a
# description of what happens. A hook that means something at a later moment
# says so with `stages:`; a hook that says nothing is a pre-commit hook.
#
# It carries no provenance stamp because it belongs to no control, like the
# `repos:` and `repo: local` lines under it.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # ee-control: DOC-001  ee-skill: lint-md@1.0.9  register: v0.29.0  register-contract: 35
      #
      # Stamped at the hook rather than at the top of the file: `lint-md` owns
      # this entry and none of the four below it. Both hand-edits it used to
      # carry are now the skill's own output: 1.0.7 dropped the upstream
      # mirror's `rev:` for a `repo: local` block, and 1.0.8 takes `entry:`
      # from .claude/skill-config.yaml (ADR 0042), so the lockfile's binary
      # below is configured rather than corrected. Only `name:` is still this
      # repository's, which adds the control id the template does not know.
      # Reconciled by the 1.0.9 run on 2026-08-28, which found the hook present
      # and skipped it.
      - id: markdownlint-cli2
        name: markdownlint-cli2 (DOC-001)
        entry: node_modules/.bin/markdownlint-cli2
        language: system
        types: [markdown]
      # ee-control: SEC-001  ee-skill: gate-secrets@0.1.0  register: v0.11.0  register-contract: 11
      #
      # Adopted rather than deployed from nothing: this hook was hand-wired in
      # Phase 0.5, before there was a gate to write it, and the stamp records
      # that rather than claiming a deployment that never happened. Its content
      # is byte-identical to what templates/precommit-hook.yaml renders.
      #
      # SEC-001 — same pinned binary as .devcontainer/setup.sh and CI.
      - id: gitleaks
        name: gitleaks (SEC-001)
        entry: gitleaks protect --staged --no-banner --redact
        language: system
        pass_filenames: false
      # ee-control: LNT-001  ee-skill: gate-quality@0.1.0  register: v0.12.0  register-contract: 12
      #
      # Adopted rather than deployed from nothing, as SEC-001's hook above was:
      # hand-wired in Phase 0.5, before there was a gate to write it. The entry
      # differs from what templates/precommit-hooks.yaml renders in one place —
      # `--force-exclude`, so the hook honours [tool.ruff] exclude when
      # pre-commit passes filenames — and that difference is narrowing.
      #
      # LNT-001 — reads [tool.ruff] in pyproject.toml, the single definition.
      - id: ruff
        name: ruff check (LNT-001)
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      # ee-control: TYP-001  ee-skill: gate-quality@0.1.0  register: v0.12.0  register-contract: 12
      #
      # Adopted, not deployed. `pass_filenames: false` is deliberate: mypy is
      # given the roots [tool.mypy] files names, so that one list is the
      # coverage the checker reads back (§ H, `coverage_key`) rather than
      # whatever pre-commit happens to have staged.
      #
      # TYP-001 — reads [tool.mypy] in pyproject.toml (strict).
      - id: mypy
        name: mypy --strict (TYP-001)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      # ee-control: SUP-003  ee-skill: gate-supply-chain@0.1.0  register: v0.14.0  register-contract: 14
      #
      # SUP-003's pre-commit locus, which was declared from Phase 0 and wired by
      # nothing until contract 14. The gate is the checker itself: no
      # third-party action linter shares this register's notion of an
      # owner-exempt action, and a second implementation would eventually
      # disagree with the first. Reached through `tools.register-check.invocation`
      # rather than by name, because a bare name resolves from PATH and what
      # answered would be auditing this repository (ADR 0020).
      #
      # The hook below it runs `register-check schema`, which validates the
      # register and reads no control at all — which is why that one does not
      # count as this locus and this one exists.
      - id: register-check-supply-chain
        name: register-check (SUP-003)
        entry: uv run register-check run --control SUP-003
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

      # ee-control: BLD-001  ee-skill: gate-build@0.1.0  register: v0.15.0  register-contract: 15
      # ee-control: DEV-001  ee-skill: gate-build@0.1.0  register: v0.15.0  register-contract: 15
      #
      # One hook, two controls, two stamps. BLD-001 and DEV-001 declare the same
      # two loci and are enforced by the same command, so a second hook would run
      # the same binary twice for no extra verdict — but the stamp read-back
      # matches on the control being evaluated, so one stamp would leave the
      # other control's pre-commit locus unrecorded.
      - id: register-check-build
        name: register-check (BLD-001, DEV-001)
        entry: uv run register-check run --control BLD-001 --control DEV-001
        language: system
        pass_filenames: false
        files: ^(Dockerfile|.*/Dockerfile|\.devcontainer/.*)$

      # The register is validated on every commit that touches it
      # (docs/01-register-schema.md).
      - id: register-check-schema
        name: register schema
        entry: uv run register-check schema
        language: system
        pass_filenames: false
        files: ^controls\.yaml$

      # --- The pre-push locus (ADR 0039) -------------------------------------
      #
      # Checks too slow for every commit and too expensive to discover in CI.
      # `.git/hooks/pre-push` is what makes them run, and `setup.sh` installs it
      # — a wired locus is not an installed hook, here as at the locus above.

      # ee-control: TST-001  ee-skill: gate-quality@0.1.0  gate-contract: 6  register: v0.25.0  register-contract: 31
      #
      # Hand-written, not deployed — as the two Phase 0.5 hooks above were. The
      # gate's template carries this block and the gate was not re-run, so the
      # stamp records the contract the template would have written and this line
      # records that a person wrote it. `register-check deployments` still reads
      # `gate-quality` as UNRECORDED, because its older stamps carry no contract
      # at all, which is the report being right rather than this being wrong.
      #
      # TST-001's pre-push locus. `always_run` with `pass_filenames: false`
      # because the suite is not a function of which files a push touches: a
      # change to one module breaks a test that imports it, and a hook given
      # filenames would run the tests belonging to the wrong files.
      - id: tests
        name: uv run pytest (TST-001)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ee-control: SEC-002  ee-skill: gate-secrets@0.1.0  gate-contract: 6  register: v0.26.0  register-contract: 32
      #
      # Hand-written, not deployed — the gate's template carries this block and
      # the gate was not re-run.
      #
      # SEC-002's pre-push locus, and a hook of its own rather than a control
      # added to the one below: `gate-secrets` owns this control and
      # `gate-supply-chain` owns that hook, and a gate editing another gate's
      # artefact is how two skills come to disagree about one file.
      #
      # SEC-003 is **not** here. Its remote blocks answer only inside a GitHub
      # Actions job, so `register-check run --control SEC-003` exits 3 on this
      # machine and the hook would refuse every push (ADR 0039).
      - id: register-check-secrets-pre-push
        name: register-check (SEC-002)
        entry: uv run register-check run --control SEC-002
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ee-control: SUP-001  ee-skill: gate-supply-chain@0.1.0  gate-contract: 5  register: v0.25.0  register-contract: 31
      # ee-control: SUP-002  ee-skill: gate-supply-chain@0.1.0  gate-contract: 5  register: v0.25.0  register-contract: 31
      #
      # Hand-written, not deployed, as the hook above it is and for the same
      # reason: the gate's template carries this block and the gate was not
      # re-run.
      #
      # One hook, two controls, two stamps — the shape the build gate's hook
      # already uses, and for the same two reasons: the same command answers
      # both, and the stamp read-back matches on the control being evaluated, so
      # one stamp would leave the other control's locus unrecorded.
      #
      # Named controls rather than a full audit, and that is forced. A bare
      # `uv run register-check` exits 3 on a developer's machine for as long as
      # SEC-003 has remote blocks that only a GitHub Actions job can answer, so
      # a full run here would refuse every push (ADR 0039 § Decision, point 4).
      - id: register-check-supply-chain-pre-push
        name: register-check (SUP-001, SUP-002)
        entry: uv run register-check run --control SUP-001 --control SUP-002
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
