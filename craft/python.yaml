    bucket: 3
    sources:
    - testing 102
    unenforced: Bucket 3.
  python.test-code-quality:
    asserts: Test code is held to the same standard as production code
    bucket: 2
    sources:
    - testing 105
    - clean-code
    unenforced: 'Configuration rather than a rule: whether the lint profile applies
      to tests/ at all. It does — there is no per-file-ignores section anywhere
