# ee-standard control register
#
# The single source of truth for what "conformant" means at Equal Experts.
# Every other artefact in this repo — CI templates, gate skills, the conformance
# checker, the devcontainer — derives from this file rather than restating it.
#
# Schema: docs/01-register-schema.md
# Concepts: docs/00-concepts.md

version: 0.11.0

meta:
  owner: platform-engineering
  # Bumped when any control's `rung`, `verify`, or `variance` changes.
  # Skills read this to decide whether a deployed artefact is stale.
  # 2: DEV-001 gained the image-digest half of its verification (Phase 0.5
  #    exit criterion — see docs/06-devcontainer-setup.md § Known gap).
  # 3: The `kind:` taxonomy was corrected — eight in-process assertions were
  #    declared `kind: command` as `standard-check assert …` strings and are
  #    now `kind: file`. `variance: justified` was removed from the vocabulary
  #    (unimplementable as specified) and its two users are `narrowing-only`.
  #    Verification blocks may declare themselves partial (ADR 0017).
  # 4: DOC-001 verifies through `npx`, so package-lock.json is the authority
  #    for its tool's version rather than four hand-kept pins.
  # 5: DOC-001's file block verifies what its `enforces` says — the 250-char
  #    ceiling and all three loci — where it previously asserted only that a
  #    configuration file existed.
  # 6: LNT-001 and TYP-001 verify through a `role:` naming a gate in the new
  #    `stacks:` section, so the mandated tools, their config locations, their
  #    pre-commit hooks and their editor extensions are register facts rather
  #    than a dictionary in the checker (ADR 0018). `suppression:` moved too.
  # 7: BLD-001 verifies its property for a devcontainer as well as a
  #    Dockerfile, and its verify blocks narrow to the shape each can read.
  # 8: Three rules that decided verdicts move out of the checker, and SUP-001
  #    stops naming two stacks. `tools.<tool>.pinned_at` records the loci that
  #    repeat a literal version, `ecosystems.<name>.frozen_install` records what
  #    installing from the lockfile looks like, and `cloud_credentials:` records
  #    what SEC-002 forbids — the last of these named by ADR 0018's ratified
  #    decision and never moved. See docs/09-phase-1.5-review.md § H.
  # 9: ADR 0019 applied to a coverage allow-list. `stacks.<stack>.source_globs`
  #    names the tracked files a stack's gates must cover, and a gate's
  #    `coverage_key` names where its allow-list lives — so a tracked module
  #    outside `[tool.mypy] files`, which nothing imports, fails TYP-001 rather
  #    than passing it silently.
  # 10: DOC-001 invokes its tool through the path the lockfile owns rather than
  #     through `npx`, which falls through to PATH. `tools.<tool>.invocation`
  #     records that form for a lockfile-sourced tool, and every locus is
  #     verified against it (ADR 0020, § H6).
  # 11: SEC-001 is verified at both its local loci. Three were declared and one
  #     was read — `precommit_hook_present` checked the hook and nothing read
  #     the ci locus, so deleting the secret-scan job kept the control green.
  #     `secrets_gate_wired_at_all_loci` subsumes the hook check and adds the
  #     job, `provenance_stamp_present` reads back the stamp `gate-secrets`
  #     writes, and `deployed_by` names the gate that owns those artefacts.
  register_contract: 11

# ---------------------------------------------------------------------------
# Stack predicates. A control whose `applies_to` names a predicate that this
# repo does not satisfy is SKIPPED, not failed. Predicates are evaluated by
# standard-check against the repo's own files — never self-declared.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Pinned tool versions. ADR 0018: a version a repository might reasonably need
# to differ, without the checker changing, is a register fact.
#
# Before contract 3 no version existed here at all, while four documents said
# one did — markdownlint-cli2 was pinned in four places, gitleaks and uv in two
# each, none authoritative, and a comment in lint.yml told humans to "change all
# three together" where there were four. The `tool_versions_match_register`
# assert compares every locus against this table, so drift is a verdict rather
# than something a reader has to notice.
# ---------------------------------------------------------------------------
tools:
  # `source` names the authority for the version. `lockfile` means a package
  # manager already owns it and no version belongs here — the loci invoke the
  # tool through that manager, so there is nothing to keep in step. `literal`
  # means no package manager owns the tool, so the version lives here and each
  # locus repeats it; those repetitions carry a `# renovate:` annotation so a
  # bot updates them together, and `tool_versions_match_register` fails the
  # build if one drifts.
  #
  # The annotation appears here too, and deliberately: the register is the
  # authority, so a proposal that bumped the loci and left this table behind
  # would be a proposal `tool_versions_match_register` rejects. `renovate.json`
  # names this file first for that reason. Renovate is enabled for custom
  # managers only — Dependabot keeps the ecosystems it understands.
  #
  # `pinned_at` names those loci. It was a four-path tuple inside the checker
  # until contract 8, which meant two things: renaming a workflow took it out of
  # comparison with nothing reporting the loss, and an adopting repository was
  # told its tools were "pinned at no known locus" against a list of *this*
  # repository's filenames. Which files repeat a version is a property of the
  # repository, so it answers *yes* to ADR 0018's test. A declared site that
  # does not exist, or that holds no pin, is a failure — silence is what this
  # field exists to stop being read as agreement.
  markdownlint-cli2:
    source: lockfile
    lockfile: package-lock.json
    # How a locus reaches the pin. `npx --no-install markdownlint-cli2` was the
    # invocation at every locus and it does not fail when the local install is
    # missing — it falls through to PATH and runs whatever global binary is
    # there, so `source: lockfile` asserted an authority nothing enforced
    # (§ H6). Measured: with node_modules deleted, `npx --no-install` and
    # `npm exec --no --` both exit 0 against a global, and the path below
    # exits 127.
    #
    # The pair is symmetric. A `literal` tool records `pinned_at` — where its
    # version is repeated. A `lockfile` tool records `invocation` — how the
    # pinned artefact is reached, so that a locus cannot silently run another.
    invocation: node_modules/.bin/markdownlint-cli2
  gitleaks:
    source: literal
    # renovate: datasource=github-releases depName=gitleaks/gitleaks
    version: "8.30.1"
    # A bumped version needs a bumped digest, and no bot can compute one. The
    # proposal carries that instruction in its body (renovate.json), and an
    # unrevised digest fails the install rather than passing it.
    sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    pinned_at:
      - .devcontainer/setup.sh
      - .github/workflows/standard-check.yml
  uv:
    source: literal
    # renovate: datasource=pypi depName=uv
    version: "0.12.5"
    pinned_at:
      - .devcontainer/setup.sh
      - .github/workflows/standard-check.yml

# ---------------------------------------------------------------------------
# Package ecosystems, and what counts as a lockfile for each. ADR 0018: this
# was a dictionary in the checker covering Python and Node only, so a Go, Rust
# or Java repository with no lockfile at all passed SUP-001. Nobody decided
# that exemption — it was which keys someone wrote — and because the register
# did not record it, no review and no `review_by` could surface it.
# ---------------------------------------------------------------------------
ecosystems:
  # `frozen_install` is what CI installing from the lockfile *looks like* for
  # this ecosystem, as regular expressions matched against a gating CI step.
  # Added at contract 8. `ci-installs-frozen` held a two-entry map — python and
  # node — so a repository with a `go.mod` was told "every CI install is frozen
  # or exact-pinned" without one ever being checked. That is the same map ADR
  # 0018 called the measured harm, in the assert beside the one it was moved out
  # of (§ H3).
  #
  # The negative half — which commands *re-resolve* — stays in the checker with
  # its reason recorded in ADR 0018: answering it means parsing a package
  # manager's argument grammar, and argument grammars in the register make the
  # register a program, which ADR 0018 rejected by name.
  python:
    manifest: [pyproject.toml]
    lockfiles: [uv.lock, poetry.lock, pdm.lock]
    dependabot: [uv, pip]
    test_commands: [pytest, tox, nox, "make test"]
    frozen_install:
      - '\buv sync\b[^\n]*--(?:frozen|locked)\b'
      - '\bpip3? install\b[^\n]*-r\s+\S+'
      - '\b(?:poetry|pdm) install\b[^\n]*--(?:sync|frozen|no-update|check)\b'
  node:
    manifest: [package.json]
    lockfiles: [package-lock.json, pnpm-lock.yaml, yarn.lock, bun.lockb]
    dependabot: [npm]
    test_commands: ["npm test", "npm run test", vitest, jest]
    frozen_install:
      - '\bnpm ci\b'
      - '\byarn install\b[^\n]*--immutable\b'
      - '\bpnpm install\b[^\n]*--frozen-lockfile\b'
  go:
    manifest: [go.mod]
    lockfiles: [go.sum]
    dependabot: [gomod]
    test_commands: ["go test"]
    # `-mod=readonly` is the default from Go 1.16, and every build verifies
    # `go.sum`, so an ordinary `go build` already resolves from the lockfile.
    # Stated rather than assumed: a repo that never runs the toolchain in CI
    # has not shown that anything reads its lockfile.
    frozen_install:
      - '\bgo mod download\b'
      - '\bgo (?:build|test|install|vet)\b'
  rust:
    manifest: [Cargo.toml]
    lockfiles: [Cargo.lock]
    dependabot: [cargo]
    test_commands: ["cargo test"]
    frozen_install:
      - '\bcargo\b[^\n]*--(?:locked|frozen)\b'
  java:
    manifest: [pom.xml, build.gradle, build.gradle.kts]
    lockfiles: [gradle.lockfile, gradle/verification-metadata.xml]
    dependabot: [maven, gradle]
    test_commands: ["gradle test", "mvn test"]
    frozen_install:
      - '\b(?:\./)?gradlew?\b[^\n]*--offline\b'
      - '\bmvn\b[^\n]*(?:--offline|-o)\b'
  ruby:
    manifest: [Gemfile, "*.gemspec"]
    lockfiles: [Gemfile.lock]
    dependabot: [bundler]
    test_commands: [rspec, "bundle exec rspec", "rake test"]
    frozen_install:
      - '\bbundle install\b[^\n]*--(?:deployment|frozen)\b'
      - '\bbundle config\b[^\n]*frozen[^\n]*true'

# ---------------------------------------------------------------------------
# Per-stack gate tools. ADR 0018: which linter a repository mandates, where its
# configuration lives, which editor extension serves it and how CI invokes it
# all answer *yes* to the boundary test — a reasonable Equal Experts repository
# could need any of them to differ without the checker changing. Before this
# section they were a dictionary inside the checker, so "the standard mandates
# ruff" was a fact no reviewer could find and no `review_by` could surface.
#
# Keyed by predicate: a stack applies to a repository exactly when its predicate
# does, evaluated against files and never self-declared. `applies_to` on a
# control names the same predicates, so LNT-001 applying to `[python,
# typescript]` and the two stacks below are the same statement made once.
#
# `config` lists where the tool's configuration may live. A `section` names a
# table within the file — `tool.ruff` in TOML, `mypy` in INI, `compilerOptions`
# in JSON — because a file existing is not the same as the tool being configured
# in it. `strict_key` is a boolean inside that section which must be true.
# Reading a boolean at a section path in TOML, INI or JSON is detection
# implementation and stays in the checker (ADR 0018).
#
# `pre_commit` and `editor_extension` are optional to the schema and required in
# fact: the validator demands whichever locus the controls using this role
# declare, so a control claiming an `editor` locus cannot rest on a gate that
# names no extension.
# ---------------------------------------------------------------------------
stacks:
  python:
    # The tracked files this stack's gates are claimed to cover. A gate naming a
    # `coverage_key` must cover every one of them — see the comment on that
    # field below.
    source_globs: ["*.py", "*.pyi"]
    gates:
      lint:
        tool: ruff
        invocation: ruff check
        pre_commit: ruff
        editor_extension: charliermarsh.ruff
        config:
          - {file: pyproject.toml, section: tool.ruff}
          - {file: ruff.toml}
          - {file: .ruff.toml}
      typecheck:
        tool: mypy
        invocation: mypy
        pre_commit: mypy
        strict_key: strict
        # Where the tool's *allow-list* lives, as a dotted path from the config
        # file's root. ADR 0019 applied to a coverage list rather than an
        # exemption list: `files = ["src", "tests", …]` is an exemption whose
        # entries are the things it does **not** name, so a tracked module
        # nothing imports is silently unchecked while TYP-001 claims "all
        # first-party source". Every file matching `source_globs` must be under
        # one of the roots named here.
        #
        # Omitting this field asserts that the tool has no allow-list to check.
        # That has to be a deliberate statement about the tool, not an oversight.
        coverage_key: tool.mypy.files
        config:
          - {file: pyproject.toml, section: tool.mypy}
          - {file: mypy.ini, section: mypy}
          - {file: .mypy.ini, section: mypy}
          - {file: setup.cfg, section: mypy}
  typescript:
    source_globs: ["*.ts", "*.tsx"]
    gates:
      lint:
        tool: eslint
        invocation: eslint
        pre_commit: eslint
        editor_extension: dbaeumer.vscode-eslint
        config:
          - {file: eslint.config.*}
          - {file: .eslintrc*}
      typecheck:
        tool: tsc
        invocation: tsc
        pre_commit: tsc
        strict_key: strict
        # `include` sits at the document root, not under `compilerOptions`,
        # which is why the path is absolute within the file. Absent, tsc
        # compiles everything below the tsconfig — no allow-list, nothing to
        # check, which the assert treats as coverage rather than as silence.
        coverage_key: include
        config:
          - {file: tsconfig.json, section: compilerOptions}

# ---------------------------------------------------------------------------
# The static cloud credentials SEC-002 forbids in a workflow. ADR 0018's
# ratified decision named "cloud-key names" among the rules that move here, and
# the move never landed: the list stayed a seven-name tuple in the checker
# through three implementation passes, mentioned in none of them and reasoned
# nowhere, while the criterion recording ADR 0018 as implemented was ticked
# (§ H4). A repository on a cloud this list has not heard of is a repository
# where SEC-002 passes by not knowing the name of the thing it is looking for.
#
# Matching is case-insensitive and treats `-` and `_` alike, because the same
# credential is `AWS_ACCESS_KEY_ID` as an env var and `aws-access-key-id:` as an
# action input. That spelling equivalence is detection implementation and stays
# in the checker (ADR 0018).
# ---------------------------------------------------------------------------
cloud_credentials:
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - GOOGLE_APPLICATION_CREDENTIALS
  - GCP_SA_KEY
  - SERVICE_ACCOUNT_KEY
  - AZURE_CLIENT_SECRET
  - AZURE_CREDENTIALS

# ---------------------------------------------------------------------------
# What counts as swallowing a failure. ADR 0018: a house idiom this list does
# not know is a suppression that goes undetected, and adding one strengthens
# detection — so the set belongs where it can be reviewed rather than inside
# `no_failure_suppression`. `|| :` is the terse spelling of `|| true`, and its
# absence from the checker's original set is what let the commonest short idiom
# through (§ D).
# ---------------------------------------------------------------------------
suppression:
  - '\|\|\s*true\b'
  - '\|\|\s*:\s*(?:$|[;&|])'
  - '\|\|\s*exit 0\b'
  - '\bset \+e\b'
  - '--exit-zero\b'

predicates:
  always: true
  python: "pyproject.toml exists"
  typescript: "tsconfig.json exists"
  container: "any Dockerfile exists"
  terraform: "any *.tf file exists"
  github-actions: ".github/workflows/ exists"
  devcontainer: ".devcontainer/devcontainer.json exists"

# ---------------------------------------------------------------------------
# Tier 1 — birth conditions.
#
# Every Tier-1 control is `blocking` from the first commit and carries
# `baseline: null`. A greenfield repo has no legacy to exempt, so there is
# nothing to baseline; a control that cannot be met at birth does not belong
# in Tier 1. Tier 2 (advisory windows) and Tier 3 (as earned) are defined in
# docs/04-build-plan.md and added to this file in later phases.
# ---------------------------------------------------------------------------
controls:

  # --- Secrets -------------------------------------------------------------

  - id: SEC-001
    title: A commit containing a secret cannot reach the remote
    enforces: >
      gitleaks runs as a pre-commit hook and as a CI job, and GitHub secret
      scanning push protection is enabled on the repository.
    standard:
      name: OWASP Secrets Management Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    also_see:
      - name: GitHub push protection
        url: https://docs.github.com/en/code-security/secret-scanning/introduction/about-push-protection
      - name: EE Supply Chain Security Handbook
        url: https://github.com/EqualExperts/ee-supply-chain-security-handbook
    tier: 1
    rung: blocking
    locus: [pre-commit, ci, remote]
    applies_to: [always]
    verify:
      - kind: command
        run: gitleaks detect --no-banner --redact
      # Three loci are declared above, and until contract 11 one was read:
      # `precommit_hook_present` checked the hook, the remote block defers to
      # Phase 3, and nothing at all read the ci locus. Deleting the secret-scan
      # job left SEC-001 green. `secrets_gate_wired_at_all_loci` subsumes the
      # hook check and adds the job, so both local loci now fail when deleted.
      #
      # `ignore_file` is here rather than in the checker because where a
      # scanner keeps its suppressions is a property of the scanner a repository
      # chose (ADR 0018). SEC-001 is `variance: forbidden` with `baseline: null`,
      # so an entry hiding a file git tracks is a weakening (ADR 0019); one
      # naming nothing tracked scopes the tool and is allowed.
      - kind: file
        assert: secrets_gate_wired_at_all_loci
        args: { tool: gitleaks, ignore_file: .gitleaksignore }
      # The gate's own deployment, read back by the gate that wrote it — a
      # stamp nothing reads records a claim rather than establishing one (§ F).
      - kind: file
        assert: provenance_stamp_present
        args: { skill: gate-secrets }
      - kind: remote
        assert: github_push_protection_enabled
    owner: platform-engineering
    deployed_by: gate-secrets
    variance: forbidden
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0001-secrets-never-reach-the-remote.md

  - id: SEC-002
    title: CI authenticates without a long-lived cloud credential
    enforces: >
      No workflow references a static cloud key secret; cloud access is obtained
      via OIDC workload identity federation.
    standard:
      name: NIST SP 800-218 (SSDF) PW.9
      url: https://csrc.nist.gov/pubs/sp/800/218/final
    also_see:
      - name: Workload Identity Federation
        url: https://cloud.google.com/iam/docs/workload-identity-federation
    tier: 1
    rung: blocking
    locus: [ci]
    applies_to: [github-actions]
    verify:
      - kind: file
        assert: no-static-cloud-keys
    owner: platform-engineering
    variance: forbidden
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0002-federated-ci-identity.md

  # --- Supply chain --------------------------------------------------------

  - id: SUP-001
    title: Dependencies resolve from a committed lockfile
    enforces: >
      A lockfile exists for every package manager in use, is committed, and CI
      installs from it in frozen mode rather than re-resolving. Every tool this
      register pins resolves to the version recorded under `tools:`, at every
      locus that installs it — the same discipline applied to the toolchain
      rather than to the dependency graph.
    standard:
      name: OpenSSF Baseline
      url: https://baseline.openssf.org/
    tier: 1
    rung: blocking
    locus: [ci]
    # `always`, not `[python, typescript]`. Naming two stacks re-created inside
    # the register the exemption ADR 0018 moved out of the checker: the register
    # defines six ecosystems, and a Go, Rust, Java or Ruby repository skipped
    # this control rather than being verified by it (§ H3). Which ecosystems a
    # repository is in is detected from `ecosystems:` by the asserts below, and
    # a repository with no package manager at all passes on that finding rather
    # than on a predicate that never looked.
    applies_to: [always]
    verify:
      - kind: file
        assert: lockfile_present_and_tracked
      - kind: file
        assert: ci-installs-frozen
      - kind: file
        assert: tool_versions_match_register
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0003-frozen-dependency-resolution.md

  - id: SUP-002
    title: Dependency updates are proposed automatically
    enforces: >
      A Dependabot or Renovate configuration exists and covers every ecosystem
      present in the repo, including GitHub Actions.
    standard:
      name: OpenSSF Scorecard — Maintained / Dependency-Update-Tool
      url: https://scorecard.dev/
    also_see:
      - name: Dependabot
        url: https://docs.github.com/en/code-security/dependabot/working-with-dependabot
    tier: 1
    rung: blocking
    locus: [ci]
    applies_to: [always]
    verify:
      - kind: file
        assert: dependency_update_config_covers_all_ecosystems
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0004-automated-dependency-proposals.md

  - id: SUP-003
    title: Third-party CI actions are pinned to a commit SHA
    enforces: >
      Every `uses:` in every workflow references a 40-character commit SHA, not
      a tag or branch. Actions published by the repository owner are exempt.
    standard:
      name: SLSA v1.0 Build levels
      url: https://slsa.dev/spec/v1.0/levels
    tier: 1
    rung: blocking
    locus: [pre-commit, ci]
    applies_to: [github-actions]
    verify:
      - kind: file
        assert: actions-pinned-to-sha
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0005-pinned-ci-actions.md

  # --- Build and runtime ---------------------------------------------------

  - id: BLD-001
    title: Every container image stage ends as a non-root user
    enforces: >
      The final stage of every Dockerfile declares a USER that is not root and
      not numeric 0; and a devcontainer states a non-root `containerUser` or
      `remoteUser` rather than inheriting whatever its base image uses.
    standard:
      name: CIS Docker Benchmark §4.1
      url: https://www.cisecurity.org/benchmark/docker
    also_see:
      - name: hadolint
        url: https://github.com/hadolint/hadolint
      - name: devcontainer.json reference — remoteUser
        url: https://containers.dev/implementors/json_reference/
    tier: 1
    rung: blocking
    locus: [pre-commit, ci]
    # One property, two shapes. A repo may have a Dockerfile, a devcontainer, or
    # both, and each block below names the shape it can actually read: hadolint
    # against a repo with no Dockerfile is a category error, not a finding.
    applies_to: [container, devcontainer]
    verify:
      - kind: file
        assert: dockerfile_final_user_is_non_root
        applies_to: [container]
      - kind: command
        run: hadolint --failure-threshold error
        applies_to: [container]
      # A devcontainer built from `image:` has no Dockerfile to read. Before
      # this block the whole control skipped here, so `remoteUser` was a JSON
      # key nothing verified and the Phase 0.5 criterion was ticked on it.
      - kind: file
        assert: devcontainer_user_is_non_root
        applies_to: [devcontainer]
    owner: platform-engineering
    variance: forbidden
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0006-containers-run-unprivileged.md

  - id: DEV-001
    title: Devcontainer features are version-pinned
    enforces: >
      `.devcontainer/devcontainer-lock.json` exists and pins every feature
      referenced by `devcontainer.json` to a resolved digest, and the `image`
      reference in `devcontainer.json` carries an `@sha256:` digest. A complete
      lock file over a floating image tag is the more dangerous half-state —
      it reads as solved and is not.
    standard:
      name: Dev Container Features specification
      url: https://containers.dev/implementors/features/
    also_see:
      - name: Dev Container specification
        url: https://containers.dev/implementors/spec/
    tier: 1
    rung: blocking
    locus: [pre-commit, ci]
    applies_to: [devcontainer]
    verify:
      - kind: file
        assert: devcontainer_lock_covers_all_features
      - kind: file
        assert: devcontainer_image_digest_pinned
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0007-pinned-devcontainer-features.md

  # --- Repository controls -------------------------------------------------

  - id: CI-001
    title: The default branch cannot be written to without a passing check
    enforces: >
      A GitHub ruleset protects the default branch requiring a pull request,
      at least one passing status check, and forbidding force-push.
    standard:
      name: OpenSSF Baseline — Branch Protection
      url: https://baseline.openssf.org/
    also_see:
      - name: GitHub rulesets
        url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets
      - name: Trunk-based development
        url: https://trunkbaseddevelopment.com/
    tier: 1
    rung: blocking
    locus: [remote]
    applies_to: [always]
    verify:
      - kind: remote
        assert: default_branch_ruleset_satisfies
        args:
          require_pull_request: true
          require_status_checks: true
          allow_force_push: false
    owner: platform-engineering
    variance: forbidden
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0008-protected-default-branch.md

  # --- Code quality --------------------------------------------------------

  - id: LNT-001
    title: Lint and format violations block the merge
    enforces: >
      The configured linter runs at editor, pre-commit and CI loci from one
      pinned configuration, and the CI invocation has no failure suppression.
    standard:
      name: Ruff rules
      url: https://docs.astral.sh/ruff/rules/
    also_see:
      - name: pre-commit
        url: https://pre-commit.com/
    tier: 1
    rung: blocking
    locus: [editor, pre-commit, ci]
    applies_to: [python, typescript]
    verify:
      - kind: file
        assert: linter-wired-at-all-loci
        # `role` selects the gate under each applicable stack in `stacks:`. The
        # tool, its config locations, its pre-commit hook and its editor
        # extension are read from there, so mandating a different linter is a
        # register change and not a checker change (ADR 0018).
        args: { role: lint }
      - kind: file
        assert: no-failure-suppression
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0009-single-lint-definition.md

  - id: TYP-001
    title: Static type checking runs in strict mode and blocks
    enforces: >
      mypy (Python) or `tsc --strict` (TypeScript) runs over all first-party
      source in CI with no per-file opt-out beyond the recorded baseline.
    standard:
      name: mypy command line — strict mode
      url: https://mypy.readthedocs.io/en/stable/command_line.html
    also_see:
      - name: Python typing specification
        url: https://typing.python.org/en/latest/spec/
    tier: 1
    rung: blocking
    locus: [pre-commit, ci]
    applies_to: [python, typescript]
    verify:
      - kind: file
        assert: typecheck-strict-and-blocking
        args: { role: typecheck }
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0010-strict-typing-from-birth.md

  - id: TST-001
    title: A failing test fails the build
    enforces: >
      The test command runs in CI, its exit code is the job's verdict, and no
      step in the chain swallows a non-zero status.
    standard:
      name: NIST SP 800-218 (SSDF) PW.8
      url: https://csrc.nist.gov/pubs/sp/800/218/final
    also_see:
      - name: The Practical Test Pyramid
        url: https://martinfowler.com/articles/practical-test-pyramid.html
    tier: 1
    rung: blocking
    locus: [ci]
    applies_to: [always]
    verify:
      - kind: file
        assert: tests-run-and-block
      - kind: file
        assert: no-failure-suppression
    owner: platform-engineering
    variance: forbidden
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0011-test-failures-are-terminal.md

  # --- Infrastructure ------------------------------------------------------

  - id: IAC-001
    title: Infrastructure code is statically analysed before apply
    enforces: >
      checkov and tflint run over all Terraform/OpenTofu in CI, and their exit
      codes block the merge.
    standard:
      name: Checkov
      url: https://www.checkov.io/1.Welcome/What%20is%20Checkov.html
    also_see:
      - name: tflint
        url: https://github.com/terraform-linters/tflint
      - name: CIS Google Cloud Platform Benchmark
        url: https://www.cisecurity.org/benchmark/google_cloud_computing_platform
    tier: 1
    rung: blocking
    locus: [pre-commit, ci]
    applies_to: [terraform]
    verify:
      - kind: command
        run: checkov --directory . --compact --quiet
      - kind: command
        run: tflint --recursive
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0012-iac-static-analysis.md

  # --- Documentation -------------------------------------------------------

  - id: DOC-001
    title: Markdown conforms to one shared, pinned rule set
    enforces: >
      markdownlint-cli2 runs from a single configuration wired at editor,
      pre-commit and CI loci. Prose lines are capped at 250 characters
      (code blocks and tables exempt), matching the lint-md deployed
      config; narrowing-only variance permits tightening below 250 in a
      repo but never loosening above it.
    standard:
      name: markdownlint-cli2
      url: https://github.com/DavidAnson/markdownlint-cli2
    tier: 1
    rung: blocking
    locus: [editor, pre-commit, ci]
    applies_to: [always]
    deployed_by: lint-md
    verify:
      - kind: command
        # Not `npx`: it falls through to PATH (§ H6). An absent local install is
        # now `tool not installed — cannot verify` (UNCLASSIFIED, ADR 0016)
        # rather than a pass earned by a global nobody pinned.
        run: node_modules/.bin/markdownlint-cli2 "**/*.md"
      - kind: file
        # The ceiling, the tool name and the editor extension id are register
        # facts (ADR 0018): a repository may reasonably tighten the ceiling or
        # name a different editor without the checker changing. What the assert
        # holds is the shape — the ceiling may narrow but never widen, and all
        # three declared loci must be wired.
        assert: markdown_gate_wired_at_all_loci
        args:
          max_line_length: 250
          tool: markdownlint-cli2
          editor_extension: DavidAnson.vscode-markdownlint
    owner: platform-engineering
    variance: narrowing-only
    baseline: null
    review_by: 2027-08-16
    rationale_adr: docs/adr/0013-one-markdown-rule-set.md

# ---------------------------------------------------------------------------
# Meta-controls. These do not check the code — they check the register and its
# enforcement. Without them the register can rot silently: a control can be
# declared blocking and be unreachable, a baseline can grow, an expiry can pass.
# ---------------------------------------------------------------------------
meta_controls:

  - id: GOV-001
    title: Every blocking control is reachable from a CI step that can fail
    enforces: >
      For each control with `rung: blocking` and `ci` in its locus, a CI step
      exists that invokes its verification and is not marked continue-on-error.
    rationale: >
      A control declared blocking but unreachable is worse than no control —
      it reports safety that does not exist. This is theme T-3 from the
      predecessor retrospective.
    verify:
      - kind: command
        run: standard-check meta GOV-001
        # ADR 0017. The file-level half genuinely passes: workflow steps are
        # read, invocations are matched, suppression is detected. What cannot
        # be seen from files is whether the workflow is a *required status
        # check* — the sharpest instance of theme T-3, and the one this control
        # was written for. That needs platform state, which is Phase 3.
        partial:
          unverified: >-
            whether the CI workflow is a required status check — reachability
            from a step that can fail is verified, being required is not
          expires: 2026-11-30

  - id: GOV-002
    title: No baseline grew
    enforces: >
      Every baseline artefact has the same or fewer entries than at the
      previous commit on the default branch.
    rationale: >
      The baseline's size is the burndown metric. A baseline that may grow is
      an exemption list, not a migration.
    verify:
      - kind: command
        run: standard-check meta GOV-002

  - id: GOV-003
    title: No control is past its review date
    enforces: >
      No control in this register has a `review_by` earlier than today.
    rationale: >
      An unreviewed control drifts from the standard it claims to enforce.
      Expiry forces the re-decision rather than letting silence stand in
      for agreement.
    verify:
      - kind: command
        run: standard-check meta GOV-003
