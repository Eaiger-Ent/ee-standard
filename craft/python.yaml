    bucket: 1
    sources:
    - typescript 002
    instrument:
      tool: ruff
      codes:
      - ANN401
      coextensive: '**Not coextensive, and the divergence is the record.** The property
        says *public*; ANN401 fires on a private argument too, and flake8-annotations
