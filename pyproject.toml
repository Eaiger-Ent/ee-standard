# register-check — the conformance checker for the Equal Experts control register.
#
# The checker is an ordinary executable, not a skill: CI runs it with no Claude
# present (docs/00-concepts.md § The plugin boundary). This file is also the
# single pinned configuration for ruff (LNT-001) and mypy (TYP-001) — every
# locus references these tables, none carries its own copy.

[project]
name = "register-check"
version = "0.8.2"
description = "Conformance checker for the Equal Experts control register"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
register-check = "register_check.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/register_check"]

[tool.ruff]
# No `target-version`. Ruff infers it from `requires-python` above, and that is
# the right source: the linter must model the *oldest* interpreter this package
# claims to support, not whichever one the environment happens to run
# (ADR 0027). Written out, `py313` was a third copy of the floor, free to drift
# from it — and it had already drifted from the interpreter, linting for 3.13
# while CI executed 3.14.
line-length = 100
src = ["src", "tests"]
# No `extend-exclude`. `.claude/hooks/md-lint.py` sat behind one on the grounds
# that lint-md owns it, and the exclusion hid eleven LNT-001 violations in a
# file this repository has itself edited. LNT-001 is `narrowing-only` with
# `baseline: null`, which admits no exemptions — an ignore path is a weakening
# by the definition in docs/00-concepts.md, and this one was recorded nowhere
# but in a comment. The file conforms instead.

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",       # ruff-specific
]

[tool.mypy]
strict = true
# `scripts` and `.claude/hooks` are first-party source too — TYP-001 says all
# of it, not the convenient parts.
files = ["src", "tests", "scripts", ".claude/hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
