# Written into the target repository's gating workflow, as steps of a job that
# already runs on `push` or `pull_request` and that has already installed
# dependencies from the lockfile (SUP-001). A workflow reachable only by
# `workflow_dispatch` is not the ci locus — it runs when a human clicks it, and
# a control reachable only that way is declared and unreachable (theme T-3).
# The verify step rejects one, so writing into one is a failure the gate finds
# rather than a mistake the repository keeps.
#
# Three steps, one stamp each, because three controls share one locus and one
# workflow. Splitting them across three skills would have three skills editing
# the same file, which is why gates are grouped by the artefact they write
# rather than one per control (docs/02-skill-family.md).
#
# Nothing here may carry `continue-on-error`, and nothing may end in a
# suppression idiom from the register's `suppression:` list. LNT-001 and TST-001
# both verify through `no-failure-suppression`, and a suppressed step is a gate
# that reports rather than blocks.
      # ee-control: LNT-001  ee-skill: gate-quality@{{SKILL_VERSION}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      - name: Lint ({{STACK}})
        run: {{LINT_INVOCATION}} .

      # ee-control: TYP-001  ee-skill: gate-quality@{{SKILL_VERSION}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      #
      # No path argument: the type checker reads the roots {{COVERAGE_KEY}}
      # names, so the coverage CI runs is the coverage the register reads back.
      - name: Type check ({{STACK}})
        run: {{TYPECHECK_INVOCATION}}

      # ee-control: TST-001  ee-skill: gate-quality@{{SKILL_VERSION}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      #
      # The command is one of the spellings the register accepts for this
      # ecosystem, confirmed by whoever ran the gate — the register bounds the
      # set, the repository picks the member. Its exit code is the job's
      # verdict; nothing wraps it.
      - name: Tests
        run: {{TEST_COMMAND}}
