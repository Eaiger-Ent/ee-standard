# standard-check — the conformance checker for the ee-standard control register.
#
# The checker is an ordinary executable, not a skill: CI runs it with no Claude
# present (docs/00-concepts.md § The plugin boundary). This file is also the
# single pinned configuration for ruff (LNT-001) and mypy (TYP-001) — every
# locus references these tables, none carries its own copy.

[project]
name = "standard-check"
version = "0.1.0"
description = "Conformance checker for the ee-standard control register"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
standard-check = "standard_check.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standard_check"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# .claude/hooks/md-lint.py is a lint-md deployed artefact (DOC-001) — its
# owner is the lint-md skill, and this repo's Python rules do not apply to it.
# The same boundary exists in .markdownlint-cli2.yaml's ignores.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",       # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
