# Pre-commit locus. Local hooks run through `uv run`, so every tool executes
# at the version uv.lock pins — the same version the ci locus installs.
repos:
  - repo: local
    hooks:
      # ee-control: DOC-001  ee-skill: lint-md@1.0.6  register: v0.5.0  register-contract: 5
      #
      # Stamped at the hook rather than at the top of the file: `lint-md` owns
      # this entry and none of the four below it. Hand-edited since deployment
      # to run through npx, so package-lock.json is the only pin — the upstream
      # mirror's `rev:` was a second copy of the version, free to drift from
      # every other locus.
      - id: markdownlint-cli2
        name: markdownlint-cli2 (DOC-001)
        entry: npx --no-install markdownlint-cli2
        language: system
        types: [markdown]
      # SEC-001 — same pinned binary as .devcontainer/setup.sh and CI.
      - id: gitleaks
        name: gitleaks (SEC-001)
        entry: gitleaks protect --staged --no-banner --redact
        language: system
        pass_filenames: false
      # LNT-001 — reads [tool.ruff] in pyproject.toml, the single definition.
      - id: ruff
        name: ruff check (LNT-001)
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      # TYP-001 — reads [tool.mypy] in pyproject.toml (strict).
      - id: mypy
        name: mypy --strict (TYP-001)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      # The register is validated on every commit that touches it
      # (docs/01-register-schema.md).
      - id: standard-check-schema
        name: register schema
        entry: uv run standard-check schema
        language: system
        pass_filenames: false
        files: ^controls\.yaml$
