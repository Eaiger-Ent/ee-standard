# YML-001's single definition (ADR 0059), read by every locus: the editor hook
# passes it with `-c`, and the pre-commit hook and the CI step find it in the
# repository root. Hand-written, not deployed: `lint-yaml` has not run here.
# It is the shape the amended `lint-yaml` writes (incubator#1220), so a later
# deployment should change two values here, and both are deliberate.
#
# `default` for style, and the floor stated rather than inherited. A rule
# inherited from a preset keeps the preset's level, `default` sets `truthy` to
# warning, and yamllint exits 0 over warnings. So a floor rule left to the
# preset is a check that cannot fail, and `yaml_gate_wired_at_all_loci`
# rejects one.
extends: default

# Not `ignore:`. `.gitignore` names what this repository does not author — the
# virtualenv, node_modules — and ADR 0019 forbids an exemption that hides a
# tracked file. `yamllint --list-files .` lists exactly what git tracks.
ignore-from-file: .gitignore

rules:
  # The correctness floor, which `controls.yaml` requires at `level: error`.
  # YAML 1.2.2 says keys are unique; PyYAML keeps the last and drops the rest
  # without a word. A second `verify:` silently replaced DOC-001's checks.
  key-duplicates:
    level: error
  # YAML 1.1 reads `NO` as false and `on` as true. `check-keys: false` keeps a
  # workflow's `on:` key legal.
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
    level: error
  comments:
    min-spaces-from-content: 1
  # The first of the two values that differ from `lint-yaml`'s 120. This
  # repository's register and workflows carry pinned digests, URLs and
  # provenance stamps, each a single token that cannot be wrapped.
  line-length:
    max: 200
  # The second. No file here opens with `---`, and a gate template must not:
  # its payload is spliced into a file that already has its own start.
  document-start: disable
