    bucket: 1
    sources:
    - pytest
    - testing 001
    instrument:
      tool: ruff
      codes:
      - PT011
      - PT012
    level: standard
  python.parametrize-form:
    asserts: Parametrised cases are declared in the conventional shape
    bucket: 1
    sources:
    - pytest
    instrument:
      tool: ruff
      codes:
      - PT006
      - PT007
    level: standard
  python.minimal-test-setup:
    asserts: Fixtures and setup stay small
    bucket: 3
    sources:
    - testing 103
    - pytest
    unenforced: Bucket 3.
  python.no-mocking-domain-logic:
    asserts: Test doubles stand in for external dependencies, not for the code under
