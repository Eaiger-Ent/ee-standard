# The conformance gate. Every blocking control with a ci locus is reachable
# from this workflow (GOV-001): the quality gates run individually for
# readable failures, then `register-check` runs the whole register.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  # Unattended, from Phase 5's sweep. Several controls here can start failing
  # with **no commit at all**: SUP-004 reads what a project published and a
  # release can be re-cut, GOV-003 expires on a date, and SEC-001's and
  # SEC-003's remote blocks read platform state an administrator can change.
  # Without this they are noticed by the next pull request, which in a quiet
  # month is nobody.
  #
  # A schedule run has no pull request, so `NO_REPOSITORY_SECRET` evaluates
  # `false` and the step below takes the `--require-complete` branch — which is
  # right: the run is on the default branch and carries the repository secret,
  # so there is no credential it should be excused for lacking.
  #
  # It stays out of CI-001's `required_checks:`. A required check is evaluated
  # on a pull request; adding a trigger changes when this workflow runs, never
  # what gates a merge.
  schedule:
    - cron: "23 5 * * 1"

# Declared rather than defaulted, because the Conformance step below hands this
# token to `register-check` so its `kind: remote` blocks can read platform state
# (ADR 0021). `contents: read` is what `actions/checkout` needs and what reading
# a branch's effective rules needs; nothing in this workflow writes. No
# provenance stamp: no gate deploys this block, and a stamp naming one would
# claim a deployment that never happened.
permissions:
  contents: read

jobs:
  # The job id is the status-check context CI-001 requires, so it is the same
  # string in four places: here, in the register's `required_checks:`, in the
  # recorded ruleset and in the ruleset GitHub enforces. Only the last is not a
  # file, which is why renaming it took a change of its own (ADR 0031).
  register-check:
    runs-on: ubuntu-latest
    steps:
      # SUP-003 — pinned to a commit SHA. Full history: gitleaks scans
      # commits (SEC-001) and GOV-002 compares baselines against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          # renovate: datasource=pypi depName=uv
          pip install uv==0.12.13

      # ee-control: SUP-001  ee-skill: gate-supply-chain@0.1.0  gate-contract: 6  register: v0.29.0  register-contract: 35
      #
      # Adopted, not deployed: hand-written in Phase 0.5 and stamped when the
      # gate that owns it was built. It sits above every other gate's steps
      # because they run the tools it places — an ordering the gate writes
      # deliberately rather than by where the file happened to grow.
      - name: Install dependencies (frozen)
        # SUP-001 — install from the committed lockfile, never re-resolve.
        run: uv sync --frozen

      # ee-control: SEC-001  ee-skill: gate-secrets@0.1.0  gate-contract: 7  register: v0.29.0  register-contract: 35
      #
      # Adopted, not deployed: hand-written in Phase 0.5 and stamped when the
      # gate that owns it was built. The version and digest below are the
      # register's, and `tool_versions_match_register` holds them to it. The
      # gate was re-run 2026-08-31 at gate contract 7, which rewrote this stamp and found the block already correct.
      - name: Install gitleaks
        # SEC-001 — same pinned version as .devcontainer/setup.sh.
        run: |
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION=8.30.1
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tgz

      - name: Install markdownlint
        # DOC-001 — the full conformance run below re-verifies the markdown
        # gate, so its binary must be present at this locus too. Version from
        # package-lock.json; `npm ci` is also SUP-001's frozen node install.
        run: npm ci --no-audit --no-fund

      # ee-control: LNT-001  ee-skill: gate-quality@0.1.0  gate-contract: 6  register: v0.29.0  register-contract: 35
      #
      # Adopted, not deployed. The three steps below are one gate's ci locus:
      # `gate-quality` writes them together because they share a workflow and a
      # frozen install, and splitting them across three skills would have three
      # skills editing one file. Each is invoked through `uv run`, so the
      # version is uv.lock's at every locus rather than a literal here.
      - name: Lint
        run: uv run ruff check .

      # ee-control: TYP-001  ee-skill: gate-quality@0.1.0  gate-contract: 6  register: v0.29.0  register-contract: 35
      - name: Type check
        run: uv run mypy

      # ee-control: TST-001  ee-skill: gate-quality@0.1.0  gate-contract: 6  register: v0.29.0  register-contract: 35
      - name: Tests
        run: uv run pytest

      # ee-control: SEC-001  ee-skill: gate-secrets@0.1.0  gate-contract: 7  register: v0.29.0  register-contract: 35
      - name: Secret scan
        run: gitleaks detect --no-banner --redact

      # ee-control: SUP-003  ee-skill: gate-supply-chain@0.1.0  gate-contract: 6  register: v0.29.0  register-contract: 35
      # ee-control: SUP-004  ee-skill: gate-supply-chain@0.1.0  gate-contract: 6  register: v0.29.0  register-contract: 35
      #
      # SUP-003's ci locus, and SUP-004's. No step of its own: this full audit
      # runs the checker with no `--control`, so it reaches every applicable
      # control including both, and a second step would be the same check twice.
      # The gate checks for exactly this before writing one.
      #
      # SUP-004's stamp was hand-written from the gate's template, and the gate
      # was re-run 2026-08-31 at gate contract 6, which rewrote it and found the
      # step already correct. It is here rather than on a step
      # of its own because this control's ci locus *is* this step, and a stamp
      # names the artefact that serves the control's locus.
      - name: Conformance
        # Actions does not put GITHUB_TOKEN in a step's environment; a workflow
        # has to hand it over. Without this the remote blocks would report
        # SKIPPED (no credentials) on a runner that had a usable token sitting
        # right there — the checker declining to answer a question it could
        # have answered (ADR 0021).
        #
        # From register contract 25 the credential handed over is
        # PLATFORM_READ_TOKEN, the standing fine-grained token ADR 0022 governs
        # and `platform_credentials:` names. It exists for one permission the
        # job token does not carry — `Administration: read` — without which
        # SEC-001's remote block cannot see `security_and_analysis` and reports
        # UNCLASSIFIED over a repository where push protection is on.
        #
        # The fallback is not belt-and-braces. **Two run shapes receive no
        # repository secret**, so the expression is empty in both and the job
        # token answers what it can: this repository is public, and a run that
        # reported SKIPPED (no credentials) because one secret was absent would
        # decline to answer CI-001 as well, which the job token can answer
        # perfectly well.
        #
        # The two are a pull request **from a fork**, and anything **Dependabot**
        # opens: GitHub keeps Dependabot's secrets in a store of its own and
        # hands a `pull_request` run none of the Actions ones. Both are the
        # platform withholding the credential by design, not a misconfiguration
        # to repair — and a repository secret readable by a run that checks out
        # a bot's dependency change is a wider blast radius than the one
        # UNCLASSIFIED control it would settle.
        env:
          GITHUB_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
          # Read into the environment rather than interpolated into the script
          # below. The value is a boolean GitHub computes and could not carry an
          # injection, but an expression expanded into shell is a shape worth
          # not having in a file other repositories read.
          #
          # It names the condition rather than one instance of it. Both
          # disjuncts are properties of the **pull request**, not of the
          # credential: keying on the secret being empty would let a revoked or
          # misspelled secret silently downgrade every run to the tolerant
          # branch, which is the carve-out-becomes-general shape this step has
          # already been through once. `user.login` rather than `github.actor`
          # because a human re-running a Dependabot check is still a run
          # Dependabot's pull request triggered.
          NO_REPOSITORY_SECRET: ${{ github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]' }}
        # Exit codes per ADR 0016: 0 fully verified and clean, 1 a verified
        # violation, 3 no violation but something could not be verified.
        #
        # `--require-complete` promotes 3 to 1, and this step passes it from
        # 2026-08-24. That ends the tolerance ADR 0016 § Ratified tolerance
        # ratified on 2026-08-17 and re-bounded twice: a run that cannot verify
        # a control now fails, rather than printing that it could not and
        # passing anyway. What made it possible was not one thing — the token
        # PLATFORM_READ_TOKEN (contract 25) let SEC-001 and SEC-003 answer, and
        # GOV-001 dropping its `partial:` (contract 26) removed the thing that
        # denied this run a 0 by design whatever the credentials.
        #
        # Two cases survive, and neither is a residue of the old tolerance.
        # Where the run receives no repository secret the token above resolves
        # to the job token, SEC-001's remote block cannot read
        # `security_and_analysis`, SEC-003's cannot read the token's expiry, and
        # the run reports UNCLASSIFIED for controls that hold. Failing there
        # would fail a contributor, or a dependency update, for a credential
        # this repository deliberately does not give them. So those runs
        # tolerate 3, and only 3 — a verified violation still fails, and the
        # incompleteness is still printed on every run.
        #
        # Dependabot was the second case, added 2026-09-07 after PR #156 sat
        # unmergeable: 12 passed, 0 failed, 2 unclassified, exit 1. The fork
        # bound was right about the platform and short by one instance of it.
        run: |
          if [ "$NO_REPOSITORY_SECRET" = "true" ]; then
            uv run register-check && status=0 || status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
              exit "$status"
            fi
          else
            uv run register-check --require-complete
          fi

