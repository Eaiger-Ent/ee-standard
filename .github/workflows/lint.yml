# ee-control: DOC-001  ee-skill: lint-md@1.0.8  register: v0.29.0  register-contract: 34
#
# Deployed artefact — DOC-001's ci locus. Reconciled by the `lint-md` 1.0.8 run
# on 2026-08-28, which detected the step and skipped it. Two hand-edits remain
# and both are narrowings the skill would not revert now: the checkout action is
# pinned to a newer commit SHA than the template's (SUP-003), and `npm ci`
# carries --no-audit --no-fund. The invocation is no longer among them — 1.0.8
# takes it from .claude/skill-config.yaml (ADR 0042), which is what closed the
# amend tracked in docs/09-phase-1.5-review.md § F.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-md:
    runs-on: ubuntu-latest
    steps:
      # SUP-003 — third-party actions are pinned to a commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Markdown
        # DOC-001 — the version comes from package-lock.json, the single
        # authority, and the binary comes from the tree `npm ci` just wrote.
        # `npx --no-install` was here and falls through to PATH (ADR 0020).
        run: |
          npm ci --no-audit --no-fund
          node_modules/.bin/markdownlint-cli2 "**/*.md"
