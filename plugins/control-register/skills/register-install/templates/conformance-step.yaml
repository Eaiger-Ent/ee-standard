# Written into the job CI-001's `required_checks:` names, after every gate's own
# steps (ADR 0057). The gates' steps run each control's tools; this one asks the
# register for every control's verdict, which is the half no tool step computes —
# `uv run mypy` passes while TYP-001 fails on a module `files` leaves out.
#
# No provenance stamp, and that is ADR 0057's rule 3 rather than an omission: a
# stamp names a control, and this step deploys none. It computes the verdict of
# every control the gates deployed.
#
# Exit codes per ADR 0016. `1` is a verified violation and fails the step. `3` is
# *nothing failed, something could not be verified* — a remote block with no
# credential that can answer it, or a plan limit (ADR 0047) — and passes, with the
# report saying which. Once CI carries a credential that can answer every remote
# block, replace the script with `<<CHECKER_INVOCATION>> --require-complete`
# (`docs/08-adopting.md` § 4.3), and `3` fails too.
      - name: Conformance (the whole register)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          <<CHECKER_INVOCATION>> && status=0 || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
