# The conformance gate. Every blocking control with a ci locus is reachable
# from this workflow (GOV-001): the quality gates run individually for
# readable failures, then `standard-check` runs the whole register.
name: Standard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standard-check:
    runs-on: ubuntu-latest
    steps:
      # SUP-003 — pinned to a commit SHA. Full history: gitleaks scans
      # commits (SEC-001) and GOV-002 compares baselines against main.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          # renovate: datasource=pypi depName=uv
          pip install uv==0.12.5

      - name: Install dependencies (frozen)
        # SUP-001 — install from the committed lockfile, never re-resolve.
        run: uv sync --frozen

      - name: Install gitleaks
        # SEC-001 — same pinned version as .devcontainer/setup.sh.
        run: |
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION=8.30.1
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tgz

      - name: Install markdownlint
        # DOC-001 — the full conformance run below re-verifies the markdown
        # gate, so its binary must be present at this locus too. Version from
        # package-lock.json; `npm ci` is also SUP-001's frozen node install.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Secret scan
        run: gitleaks detect --no-banner --redact

      - name: Conformance
        # Exit codes per ADR 0016: 0 fully verified and clean, 1 a verified
        # violation, 3 no violation but something could not be verified.
        #
        # 3 is tolerated here, and only here, until Phase 3 implements
        # `kind: remote` verification — today CI-001 and SEC-001's remote blocks
        # report SKIPPED (no credentials), which is the whole of the 3. This is
        # a bounded exception to ADR 0016 § Ratified tolerance, not a reading of
        # it: when Phase 3 lands, this step becomes
        # `uv run standard-check --require-complete` and 3 stops being
        # acceptable. The build plan's Phase 3 criteria hold that flip.
        run: |
          uv run standard-check && status=0 || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
