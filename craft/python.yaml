        which had already missed DTZ901. Verified preview-free at ruff 0.16.5.
    level: standard
  python.no-shadowed-loop-variable:
    asserts: An inner binding does not overwrite the loop variable
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      codes:
      - PLW2901
    level: standard
  python.no-blind-except:
