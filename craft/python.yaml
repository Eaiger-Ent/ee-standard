      no codes. The property is met by running it, and its line length is python.line-length's
      number by construction.
  python.no-trailing-whitespace:
    asserts: No trailing or stray whitespace
    bucket: 1
    sources:
    - pep8
    instrument:
      tool: ruff
      codes:
      - W291
      - W293
    level: standard
  python.pep604-unions:
    asserts: Unions and optionals use PEP 604 syntax rather than `typing.Union`
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      codes:
      - UP007
      - UP045
    level: standard
  python.pathlib-over-os-path:
    asserts: Filesystem paths go through `pathlib`
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      linter: flake8-use-pathlib
      coextensive: Every rule in it replaces an os.path call with a pathlib one.
        The register cited PTH100-PTH210, which had already missed PTH211. Verified
        preview-free at ruff 0.16.5.
    level: standard
  python.comprehension-over-manual-loop:
    asserts: A transformation is a comprehension, not an append loop
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      linter: flake8-comprehensions
      coextensive: Every rule in it rewrites a manual construction as a comprehension
        or a direct call. PERF401 asserts the same property from Perflint and is
        named beside it, because a linter selector cannot reach into another linter.
