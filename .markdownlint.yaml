# .markdownlint.yaml
# ee-control: DOC-001  ee-skill: lint-md@1.0.6  register: v0.5.0  register-contract: 5
#
# Deployed artefact. DOC-001 is `narrowing-only`, so rules may be added or
# tightened here but not removed or loosened — `markdown_gate_wired_at_all_loci`
# verifies that the MD013 ceiling below is at or under the register's.
# See docs/00-concepts.md § The provenance stamp.

default: true
MD013:
  line_length: 250
  code_blocks: false
  tables: false
MD024:
  siblings_only: true
MD050:
  style: asterisk
MD060:
  style: compact
