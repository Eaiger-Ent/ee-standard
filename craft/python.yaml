  python.parameterised-sql:
    asserts: User input never reaches SQL by concatenation
    bucket: 1
    sources:
    - security 103
    - asvs
    - ruff
    instrument:
      tool: ruff
      codes:
      - S608
    level: standard
    note: 'C5 probed it. It fired on a parameterised query built with a validated
      table name, and is kept: the rule reads string formatting into SQL and cannot
