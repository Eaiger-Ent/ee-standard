# Written into the target repository's `.pre-commit-config.yaml`, under the
# `repos: - repo: local` entry's `hooks:` list — one pair per stack the
# repository is in. Double-brace placeholders are substituted from the register
# before the block is written; none of them is a value this file may decide.
#
# One stamp per hook, never one at the top of the file. A
# `.pre-commit-config.yaml` holds hooks for several controls — this repository's
# own holds five — and a whole-file stamp would claim the ones this gate does
# not own (docs/00-concepts.md § The provenance stamp).
#
# {{LINT_INVOCATION}} and {{TYPECHECK_INVOCATION}} are the register's
# `stacks.{{STACK}}.gates.<role>.invocation`, written verbatim. That string is
# what every locus runs and what the checker matches a CI step against, so the
# gate never composes its own: a bare tool name here would be a hook resolving
# from PATH rather than from the artefact the lockfile pins (ADR 0020).
      # ee-control: LNT-001  ee-skill: gate-quality@{{SKILL_VERSION}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      - id: {{LINT_HOOK_ID}}
        name: {{LINT_TOOL}} ({{STACK}}, LNT-001)
        entry: {{LINT_INVOCATION}}
        language: system
        # Derived from the register's `stacks.{{STACK}}.source_globs`, which is
        # the set of tracked files this stack's gates are claimed to cover. A
        # hand-picked pre-commit `types:` tag would be a second statement of
        # that set, free to name fewer files than the control claims.
        files: '{{SOURCE_PATTERN}}'

      # ee-control: TYP-001  ee-skill: gate-quality@{{SKILL_VERSION}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      #
      # `pass_filenames: false` is deliberate and is not a narrowing. The type
      # checker is given the roots its own coverage list names — the register's
      # `coverage_key`, `{{COVERAGE_KEY}}` — so that one list is both what runs
      # here and what the checker reads back. Passing staged filenames instead
      # would make the hook's coverage whatever a commit happened to touch,
      # which is smaller than the control claims and invisible in review.
      - id: {{TYPECHECK_HOOK_ID}}
        name: {{TYPECHECK_TOOL}} ({{STACK}}, TYP-001)
        entry: {{TYPECHECK_INVOCATION}}
        language: system
        pass_filenames: false
        files: '{{SOURCE_PATTERN}}'
