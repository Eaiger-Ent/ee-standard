# Written into the target repository's gating workflow, as a step of the job
# that already runs on push or pull_request. A workflow that runs only on
# `workflow_dispatch` is not the ci locus — it runs when a human clicks it, and
# a control reachable only that way is declared and unreachable (theme T-3).
#
# **Write this only when the repository has no full audit.** A gating step
# running {{TOOL_INVOCATION}} with no `--control` reaches every applicable
# control, including this one, and a second step would be the same check twice.
# The skill checks before writing, and says when it did not.
#
# No `continue-on-error`, and nothing after the invocation. IAC-001 is
# `narrowing-only` with `baseline: null`: a step that reports findings without
# blocking is theme T-3 — a gate that is not a gate — and the register's
# `suppression:` list is what the checker matches such a step against.
      # ee-control: IAC-001  ee-skill: gate-iac@{{SKILL_VERSION}}  gate-contract: {{GATE_CONTRACT}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      - name: Infrastructure analysis
        run: {{TOOL_INVOCATION}} run --control IAC-001
