# Not a gate. This workflow verifies a *claim* rather than a control: that
# `requires-python` in pyproject.toml is true.
#
# `.python-version` names the interpreter every locus runs the gates on
# (ADR 0027), and it now names 3.14. `requires-python = ">=3.13"` says
# standard-check also works on 3.13 — and adopters install it as a dependency,
# so somebody is on that floor. Without this job the claim would be published in
# package metadata and tested nowhere, which is the shape this repository exists
# to catch: a property declared and never verified.
#
# No provenance stamp: no gate deploys this, and a stamp naming one would claim
# a deployment that never happened. It is deliberately not in CI-001's
# `required_checks:` — a support claim failing is a thing to know about, not a
# reason a conformant change cannot merge. Widen the floor or fix the code; do
# not make this required.
name: Support floor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  support-floor:
    runs-on: ubuntu-latest
    steps:
      # SUP-003 — pinned to a commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: |
          # renovate: datasource=pypi depName=uv
          pip install uv==0.12.5

      - name: Tests, on the oldest interpreter this package claims to support
        # `UV_PYTHON` is the one thing that outranks `.python-version` — recorded
        # in ADR 0027 as the residual risk of choosing a toolchain file. It is
        # used here on purpose, and this is the only place it appears: the floor
        # is a different interpreter from the pinned one by definition, so the
        # job that tests it has to override the pin rather than read it.
        #
        # The floor itself is not repeated here. It comes from `requires-python`,
        # so widening or raising the support claim moves this job with it and
        # there is no second copy to drift.
        run: |
          floor="$(sed -n 's/^requires-python *= *"[^0-9]*\([0-9]*\.[0-9]*\)".*/\1/p' pyproject.toml)"
          test -n "${floor}" || { echo "no requires-python in pyproject.toml" >&2; exit 1; }
          echo "support floor from requires-python: ${floor}"
          export UV_PYTHON="${floor}"
          uv sync --frozen
          uv run python -V
          uv run pytest -q
