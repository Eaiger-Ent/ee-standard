# Written into the target repository's gating workflow, as steps of the job that
# already runs on push or pull_request. A workflow that runs only on
# `workflow_dispatch` is not the ci locus — it runs when a human clicks it, and
# a control reachable only that way is declared and unreachable (theme T-3).
#
# Order matters and is not cosmetic. The frozen install comes first because
# every other gate's steps run the tools it places; a lint step written before
# it lints against nothing. When this gate runs after another has already
# written its steps, the install goes *above* them rather than at the end.
#
# {{FROZEN_INSTALL}} is the register's
# `ecosystems.{{ECOSYSTEM}}.frozen_install_command` for the lockfile this
# repository has, written verbatim. The register also holds the patterns the
# checker credits, and the schema requires each command to match one of them —
# so this gate cannot write an install step its own verify step will refuse.
      # ee-control: SUP-001  ee-skill: gate-supply-chain@{{SKILL_VERSION}}  gate-contract: {{GATE_CONTRACT}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      - name: Install dependencies (frozen)
        run: {{FROZEN_INSTALL}}

      # ee-control: SUP-001  ee-skill: gate-supply-chain@{{SKILL_VERSION}}  gate-contract: {{GATE_CONTRACT}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      # ee-control: SUP-002  ee-skill: gate-supply-chain@{{SKILL_VERSION}}  gate-contract: {{GATE_CONTRACT}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      # ee-control: SUP-003  ee-skill: gate-supply-chain@{{SKILL_VERSION}}  gate-contract: {{GATE_CONTRACT}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      #
      # The ci half of the three controls' loci. Named controls rather than a
      # full audit, so a failing step names what a developer has to fix — and
      # one step rather than three, because the same command answers all three
      # and a second invocation of one binary buys no extra verdict. Three
      # stamps, because the read-back matches on the control being evaluated and
      # one stamp would leave the other two loci unrecorded.
      #
      # SUP-001 and SUP-002 joined SUP-003 here at register contract 31, with
      # the `pre-push` locus that made their wiring readable at all: until then
      # each was verified only by its *property* — a lockfile exists, a
      # dependency-update config covers every ecosystem — which is a different
      # claim from something enforcing it before a merge.
      #
      # A full audit reaches every applicable control including these three, so
      # a repository whose gating workflow already runs {{TOOL_INVOCATION}} with
      # no `--control` needs no step here — check before writing one, and say
      # that you did not.
      - name: Supply chain
        run: {{TOOL_INVOCATION}} run --control SUP-001 --control SUP-002 --control SUP-003
