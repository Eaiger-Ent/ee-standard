# ADR 0052's evidence gates. A group **names** a predicate rather than
# describing one: `controls.yaml` already carries a named set of *does this
# artefact exist* tests, read by `_applicable_gates`, and IAC-001's
# `applies_to: [terraform]` is the infrastructure group's gate already written
# and already read.
#
# Predicates resolve from `controls.yaml` first and from here second, and **a
# name defined in both is a schema error** — two definitions of *is there
# Terraform here* would eventually disagree about a repository and nobody would
# know which one the profile used. `tests/test_craft_register.py` is what makes
# that illegal rather than discouraged.
#
# Two predicates belong here, and each for the same reason: no control gates on
# it, and adding one to the control register purely for Craft's benefit is the
# direction ADR 0053 sent Craft data away from.
#
# **These two are also the whole of what the installer evaluates itself.** The
# control register's predicates are a closed grammar its checker compiles; these
# are a sentence, because neither fact they read — a top-level key in a
# document, a dependency in a manifest — is a path, and the grammar there is
# deliberately closed to everything that is not. `docs/craft/build.installer.md`
# § The predicate grammar cannot say *react is a dependency* is the reasoning,
# including why extending that grammar was the wrong way out.
predicates:
  openapi-document:
    asks: any file with a top-level `openapi` key exists
    why: >
      Keyed on the document's own declaration, not on its name. `openapi.yaml`,
      `api/spec.yaml` and `docs/openapi/v1.json` are all real conventions, and a
      glob over them would both miss and over-match — `spectral` finds nothing
      in a file that does not declare itself and plenty in one that does,
      whatever it is called. ADR 0052's requirement applied literally: the gate
      reads the same fact the rule needs in order to run at all.

  # Stack inference rather than an evidence gate, and the first predicate here
  # that is not ADR 0052's. `docs/craft/build.installer.md` § How the stack is
  # inferred is the whole reasoning; the short of it is that the control
  # register's `typescript` predicate answers a different question — it asks
  # whether a linter is *gated* here, which Angular and a Node service satisfy
  # too, and 71 of `craft/react.yaml`'s 93 rule bindings would be wrong for
  # them: every `jsx-a11y`, `@eslint-react`, `react-hooks` and `react` rule.
  #
  # A React profile needs both to be true: `react` for the rules to apply, and
  # `typescript` for there to be a locus to write them at.
  react:
    asks: >-
      package.json declares react in dependencies, devDependencies or
      peerDependencies
    why: >
      Keyed on what the manifest declares, like `openapi-document` above, and
      for a sharper reason than tidiness. ADR 0052 targets **new** repositories,
      where the dependency is declared before the first component is written: a
      path proxy such as `any *.tsx file exists` reads false on a repository one
      commit old, which is precisely the repository the profile is for. It
      over-matches as well — Preact and Solid use the same extension.
      `peerDependencies` is in the list because a component library declares
      react there and nowhere else, and its code is React code by every rule in
      `craft/react.yaml`.

# ADR 0056: where a tool keeps its configuration, for a tool `controls.yaml`'s
# `stacks:` does not name. **A tool named here and in `stacks:` is a schema
# error** — the rule the predicates above follow, for the same reason: two lists
# of where pytest looks would eventually disagree, and nobody would know which
# the profile used. The day a control comes to gate pytest's configuration,
# `tests/test_craft_register.py` fails and this entry moves.
#
# `locations` is the tool's own search order, first wins, as measured on pytest
# 9.1.1 — not the order `stacks:` uses, which is the checker's. A pytest table
# in `pyproject.toml` ignores `tox.ini` and `setup.cfg`, and anything above it
# ignores `pyproject.toml`, so an installer finding any location other than the
# two it writes stops (ADR 0056 rule 2). `writes` is those two, in preference:
# the native table first, because two spellings in one file is an error and a
# new repository should get the one pytest recommends.
surfaces:
  pytest:
    locations:
      - {file: pytest.toml, section: pytest}
      - {file: .pytest.toml, section: pytest}
      - {file: pytest.ini, section: pytest}
      - {file: .pytest.ini, section: pytest}
      - {file: pyproject.toml, section: tool.pytest}
      - {file: pyproject.toml, section: tool.pytest.ini_options}
      - {file: tox.ini, section: pytest}
      - {file: setup.cfg, section: "tool:pytest"}
    writes:
      - {file: pyproject.toml, section: tool.pytest}
      - {file: pyproject.toml, section: tool.pytest.ini_options}

# A profile is `<stack>/<level>` and nothing more (ADR 0052), and its version is
# a **counter rather than semver** — `design.profiles.md` § The version is a
# counter, because semver would point the wrong way. Direction is recorded per
# entry in `register-variance`'s own three words, and its rule comes with them:
# a mixed delta is a loosening.
#
# The entries live here rather than in the per-scope files because a profile
# spans them: `python/standard` binds every `python.` row at that level and
# every `any.` row whose evidence gate is open, so its version moves when either
# file does. Entries kept per-file would split one profile's history across two.
profiles:
  python/standard:
    version: 4
    changes:
      - version: 4
        moved: neither
        what: >
          `python.consistent-formatting` moves from bound to the residue. It
          was counted as enforced by `ruff format`, and nothing at any locus
          runs a format check, so the count claimed a property no build could
          fail on. Nothing a repository runs changes; the record stops
          overstating it. `docs/18-phase-8-review.md` § LNT-001's title.
      - version: 3
        moved: neither
        what: >
          The residue only. `python.test-independence`,
          `python.no-flaky-tests` and `python.branch-coverage-floor` are bound at
          `strict` from ADR 0056, so they leave this level's residue the way
          every `strict`-bound property does. Nothing this level selects
          changed.
      - version: 2
        moved: neither
        what: >
          The residue only, from S6. Nothing this level selects changed.
          `python.no-mocking-domain-logic` moves from judgment-only to a check
          that could hold it; `python.test-independence` and
          `python.no-flaky-tests` name the pytest plugins that would assert them;
          and `python.branch-coverage-floor` joins as a property with a
          candidate instrument and no binding. `docs/craft/review.trial.md`
          § The revision.
      - version: 1
        moved: neither
        what: >
          First publication. The selection S3 benched, migrated from
          `docs/craft/assess.rules.md` without change.
  python/strict:
    version: 4
    changes:
      - version: 4
        moved: neither
        what: >
          `python.consistent-formatting` moves from bound to the residue. It
          was counted as enforced by `ruff format`, and nothing at any locus
          runs a format check, so the count claimed a property no build could
          fail on. Nothing a repository runs changes; the record stops
          overstating it. `docs/18-phase-8-review.md` § LNT-001's title.
      - version: 3
        moved: narrowing
        what: >
          ADR 0056: the suite runs in a random order (`pytest-randomly`), a test
          fails past 30 seconds (`pytest-timeout`), a connection past loopback
          is refused (`pytest-socket`), and branch coverage below the
          repository's own floor fails the run (`pytest-cov`). Four development
          dependencies, the first this profile adds, and one region in
          `pyproject.toml`'s pytest table. `docs/craft/review.trial.md` § The
          guards, installed is the measurement.
      - version: 2
        moved: narrowing
        what: >
          S6's revision: `python.tests-can-fail` binds `B015`, `PLW0129` and
          `PT017`, three shapes of assertion that cannot fail, which the trial
          repository's fast, assistant-written suite carried past every gate.
          All three declare no fix. The residue moves as `python/standard@2`
          records. `docs/craft/review.trial.md` § The revision is the
          measurement, and the pytest guards and the coverage floor it decided
          on wait for an instrument shape this contract does not have.
      - version: 1
        moved: neither
        what: >
          First publication. `standard` plus the eleven properties
          `docs/craft/review.strict.md` measured.
  react/standard:
    version: 2
    changes:
      - version: 2
        moved: neither
        what: >
          **The migration had lost three things the bench ran, and the renderer
          found all three by trying to write the file.** The eleven
          `testing-library` rules are scoped to tests rather than to every
          source file; the two presets the profile takes as a base are recorded
          in `craft/react.yaml`'s `bases:`, which two `satisfied_by` rows
          already rested on; and six `@eslint-react` rules the base enables and
          `react-hooks` owns are recorded as `alternatives:`, where one of the
          seven already was. Nothing about the profile changed — this is the
          register catching up with `docs/craft/review.bench.md`, which is why
          the direction is `neither` rather than a narrowing.
      - version: 1
        moved: neither
        what: >
          First publication. The selection S3 benched, migrated from
          `docs/craft/assess.rules.md` without change.
  react/strict:
    version: 2
    changes:
      - version: 2
        moved: neither
        what: >
          **The migration had lost three things the bench ran, and the renderer
          found all three by trying to write the file.** The eleven
          `testing-library` rules are scoped to tests rather than to every
          source file; the two presets the profile takes as a base are recorded
          in `craft/react.yaml`'s `bases:`, which two `satisfied_by` rows
          already rested on; and six `@eslint-react` rules the base enables and
          `react-hooks` owns are recorded as `alternatives:`, where one of the
          seven already was. Nothing about the profile changed — this is the
          register catching up with `docs/craft/review.bench.md`, which is why
          the direction is `neither` rather than a narrowing.
      - version: 1
        moved: neither
        what: >
          First publication. `standard` plus `react.effect-dependencies-exhaustive`,
          which is the whole of the level on this stack — an asymmetry
          `design.profiles.md` § What `strict` adds records rather than explains
          away.
