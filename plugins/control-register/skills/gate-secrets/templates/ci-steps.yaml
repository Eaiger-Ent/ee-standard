# Written into the target repository's gating workflow, as steps of the job
# that already runs on push or pull_request. A workflow that runs only on
# `workflow_dispatch` is not the ci locus — it runs when a human clicks it, and
# a control reachable only that way is declared and unreachable (theme T-3).
# The verify step rejects one, so writing into one is a failure the gate finds
# rather than a mistake the repository keeps.
#
# {{TOOL_VERSION}} and {{TOOL_SHA256}} come from the register's `tools:` table.
# The version appears twice in the repository once this is written — here and in
# the developer environment — which is why the register records those sites in
# `tools.{{TOOL}}.pinned_at` and `tool_versions_match_register` fails the build
# when one drifts. Add this workflow's path there if it is not already listed.
      # ee-control: SEC-001  ee-skill: gate-secrets@{{SKILL_VERSION}}  gate-contract: {{GATE_CONTRACT}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      - name: Install {{TOOL}}
        run: |
          # renovate: datasource=github-releases depName={{TOOL_REPO}}
          TOOL_VERSION={{TOOL_VERSION}}
          curl -sSfL -o {{TOOL}}.tgz "https://github.com/{{TOOL_REPO}}/releases/download/v${TOOL_VERSION}/{{TOOL}}_${TOOL_VERSION}_linux_x64.tar.gz"
          echo "{{TOOL_SHA256}}  {{TOOL}}.tgz" | sha256sum -c -
          tar -xzf {{TOOL}}.tgz {{TOOL}}
          sudo install {{TOOL}} /usr/local/bin/{{TOOL}}
          rm {{TOOL}} {{TOOL}}.tgz

      - name: Secret scan
        run: {{TOOL}} detect --no-banner --redact

      # ee-control: SEC-002  ee-skill: gate-secrets@{{SKILL_VERSION}}  gate-contract: {{GATE_CONTRACT}}  register: v{{REGISTER_VERSION}}  register-contract: {{REGISTER_CONTRACT}}
      #
      # SEC-002's ci locus. Until contract 32 this control was verified by its
      # *property* alone — no workflow names a forbidden credential — read out
      # of the files on disk, which is a different claim from something
      # enforcing it before a merge. The gate is the checker itself, because no
      # third-party tool shares this register's `cloud_credentials:` list.
      #
      # A full audit reaches every applicable control including this one, so a
      # repository whose gating workflow already runs {{CHECKER_INVOCATION}} with
      # no `--control` needs no step here — check before writing one, and say
      # that you did not.
      - name: Credentials
        run: {{CHECKER_INVOCATION}} run --control SEC-002
