      - PERF401
    level: standard
  python.no-boolean-trap:
    asserts: A boolean is not passed positionally into a call whose meaning it flips
    bucket: 1
    sources:
    - ruff
    instrument:
      tool: ruff
      codes:
      - FBT001
      - FBT002
    level: standard
  python.docstring-presence:
    asserts: Public modules, classes and functions carry a docstring
    bucket: 1
    sources:
    - pep257
    - google
    instrument:
      tool: ruff
      codes:
      - D100
      - D101
      - D102
      - D103
      - D104
      - D105
      - D106
      - D107
    level: strict
    scope: source
    note: Scoped to the package source. A test function's name is its documentation;
      requiring a docstring as well is the kind of rule a team turns off. review.strict.md
      § The verdicts the bench handed S4.
  python.docstring-form:
    asserts: A docstring has a one-line summary in the imperative
    bucket: 1
    sources:
    - pep257
    instrument:
      tool: ruff
      codes:
      - D205
      - D401
    level: strict
    note: 'Exact codes rather than D2xx and D4xx, and not scoped: a docstring that
      exists should be well formed wherever it is. The wide reading brings D203
      against D211 and D212 against D213, which ruff warns about and then silently
      resolves by dropping one.'
  python.no-commented-out-code:
    asserts: Dead code is deleted, not commented
    bucket: 1
    sources:
    - clean-code 004
    instrument:
      tool: ruff
      codes:
      - ERA001
    level: standard
    note: 'C5 kept it and named it the one to watch at S6: it flagged a comment
      documenting a data format.'
  python.self-documenting-code:
    asserts: Code needs few comments because it reads clearly
    bucket: 3
    sources:
    - clean-code 103
    - code-quality
    unenforced: Bucket 3.
  python.no-untracked-todo:
